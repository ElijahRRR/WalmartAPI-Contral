# 中国卖家禁售 / 本系统主动排除的品类
# L1 阶段只做 Amazon 路径/title 关键词硬拦 (excluded_categories)
# L2 R2 阶段做 9 大禁售大类 (mega_forbidden_categories, 基于 walmart_product_type 匹配)
#
# 匹配规则(2026-08-19 与实现对齐,此前这段注释写的"子串"是旧口径):
#   - excluded_categories: scope=amazon_category 是**路径段等值**(2026-08-19 修:
#     子串匹配曾把 "Clothing & Closet Storage" 下的衣柜收纳当服饰拦);
#     scope=walmart_pt / title_keyword 仍是子串 (大小写不敏感)
#   - mega_forbidden_categories.pt_contains: walmart_product_type **词边界 + 可选
#     复数**(\bkws?\b,大小写不敏感;"Bra" 不会命中 "Brackets")
#   - mega_forbidden_categories.pt_exact: walmart_product_type **精确等值**——
#     给"整机拦、配件放"的类目用(词在 PT 里 ≠ 产品是那个东西)
#   - mega_forbidden_categories.walmart_category_prefix: walmart_category_map.raw->>'walmart_category' 前缀

version: 2
updated: 2026-04-20

# -------- L1 硬禁 (Amazon 路径 / title 关键词) --------
excluded_categories:
  # --- 3C 电子 (带电产品, 搬运搞不定) ---
  - match: "Consumer Electronics"
    scope: amazon_category
    reason: 3C 禁售
  - match: "Laptops"
    scope: walmart_pt
    reason: 3C 禁售
  - match: "Headphones"
    scope: walmart_pt
    reason: 3C 禁售
  - match: "Smartwatches"
    scope: walmart_pt
    reason: 3C 禁售
  # "Cell Phones" 不是 "Cell Phone"(2026-08-19 所有者定稿:手机壳/数据线/
  # 贴膜等不带电配件要卖):walmart_pt 是子串匹配,"Cell Phone" 会连
  # "Cell Phone Cases" 一起拦;整机 PT 是 "Cell Phones",按整机词拦
  - match: "Cell Phones"
    scope: walmart_pt
    reason: 3C 禁售
  - match: "Tablets"
    scope: walmart_pt
    reason: 3C 禁售

  # --- 服饰 ---
  - match: "Clothing"
    scope: amazon_category
    reason: 服饰禁售
  - match: "Apparel"
    scope: walmart_pt
    reason: 服饰禁售
  - match: "Shoes"
    scope: amazon_category
    reason: 服饰禁售(鞋)

  # --- 汽配 ---
  - match: "Automotive Parts"
    scope: walmart_pt
    reason: 汽配禁售
  - match: "Auto Parts"
    scope: amazon_category
    reason: 汽配禁售
  - match: "Car Accessories"
    scope: walmart_pt
    reason: 汽配禁售

  # --- 带电产品 (title 关键词) ---
  # 用户决定放松硬禁 (2026-04-21): 带电判定交给 L3 LLM 语义, 这里只保留最确定的整机电池类
  # 原来的 Battery / Rechargeable / Lithium 会硬拦 "No Battery 配件" / "LED 装饰灯" 等误判
  # - match: "Battery"           scope: title_keyword  (放松, 交 L3)
  # - match: "Rechargeable"      scope: title_keyword  (放松, 交 L3)
  # - match: "Lithium"           scope: title_keyword  (放松, 交 L3)
  - match: "Power Bank"
    scope: walmart_pt
    reason: 带电产品禁售


# -------- L2 R2 禁售大类 (基于判定后的 Walmart PT) --------
# 命中任一 key 即 R2 触发, -100, stage_stopped_at=L2
#
# 每个 key 的命中策略 (任一满足即命中):
#   - pt_contains: walmart_product_type 包含任一关键词 (不区分大小写)
#   - walmart_category_prefix: walmart_category_map.raw['walmart_category'] 以任一前缀开头
#
# 关键词按沃尔玛官方 PT 字典的常见命名选择, 保守策略: 宁可漏不可错杀
#
# 顺序 = 优先级 (先命中先生效). 把更"具体"的类目 (medical / pet_food) 排在更"泛"的前面 (electronics / food)
# 以避免 "Blood Pressure Monitor" 被 electronics.Monitor 先命中这种 bug.
mega_forbidden_categories:
  # --- 高优先 (更具体) ---
  - key: medical
    walmart_policy: "Medical Devices"
    reason: "医疗器械禁售: FDA 510(k) 许可"
    pt_contains:
      - "Medical Device"
      - "Diagnostic"
      - "Hearing Aid"
      - "Therapeutic"
      - "Surgical"
      - "Blood Pressure Monitor"
      - "Glucose Meter"
      # "Thermometer" 泛词已收窄(2026-08-19 所有者「减少误伤」定稿):词边界
      # 命中 Aquarium/Oven/Pool/Weather/Automotive Thermometers 等 19 个 PT,
      # 其中医疗只有 2 个——鱼缸温度计不是医疗器械。真医疗按具体词拦:
      - "Medical Thermometer"
      - "Basal Thermometer"
      - "Ear Thermometer"
      - "Pulse Oximeter"
      - "Nebulizer"
      - "CPAP"
      - "Syringe"
      - "Prescription"
      - "OTC Drug"
      - "Pharmaceutical"
      # 新增 (来自 walmart_error_records F 类实证 PT):
      - "Heating Pad"
      - "Drug Test"
      - "Catheter"
      - "Spirometer"
      - "Urinary Tract Infection Test Strip"
      - "Endoscope"
      - "Eye Drop"
      - "Instrument Tray"
      - "Compression Glove"
      - "Compression Sleeve"
      - "Compression Sock"
      - "Protective Eyewear"   # 实证 11 条 F 类
      - "Sport Goggle"
    walmart_category_prefix:
      - "Health"
      - "Medical"
      - "Personal Care"

  # === 新增 G 药品/补充剂禁售 (膳食/顺势疗法/中药) ===
  - key: drugs_supplements
    walmart_policy: "Dietary Supplements"
    reason: "药品/膳食补充剂禁售: FDA 注册 + restricted sellers + MoCRA, 中国卖家 0 可能合规"
    pt_contains:
      - "Homeopathic"
      - "Herbal Remedy"
      - "Herbal Supplement"
      - "Dietary Supplement"
      - "Protein Supplement"
      - "Mineral Supplement"
      - "Vitamin"
      - "Multivitamin"
      - "Probiotic"
      - "Weight Loss"
      - "Melatonin"
      - "Animal Supplement"          # 宠物补充剂也禁 (FDA/AAFCO)
      - "Pet Vitamin"
      - "Pet Supplement"
    walmart_category_prefix:
      - "Dietary Supplements"
      - "Homeopathic"

  # === 新增 特殊-武器/枪支 (实证 B+C 104 条) ===
  - key: weapons_firearms
    walmart_policy: "Military & Law Enforcement"
    reason: "武器/枪支/弹药禁售: 联邦法绝对禁 + Walmart Firearm Accessories 政策"
    pt_contains:
      - "Firearm"
      - "Ammunition"
      - "Tactical Knife"
      - "Throwing Knife"
      - "Pocket Knife"             # Walmart 拦得严, 实证多条
      - "Switchblade"
      - "Butterfly Knife"
      - "Brass Knuckle"
      - "Pepper Spray"
      - "Taser"
      - "Stun Gun"
      - "Crossbow"
      - "Airsoft"
      - "BB Gun"
      - "Pellet Gun"
      - "Paintball Gun"
      - "Body Armor"
      - "Ballistic"
      - "Bulletproof"
    walmart_category_prefix:
      - "Hunting"
      - "Weapons"

  # === 新增 烟酒 (Alcohol / Tobacco 100% 禁) ===
  - key: alcohol_tobacco
    walmart_policy: "Alcohol"
    reason: "酒精/烟草/电子烟完全禁售 (Walmart 零容忍)"
