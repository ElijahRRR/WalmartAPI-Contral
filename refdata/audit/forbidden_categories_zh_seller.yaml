      - "Wine"           # 酒具不是酒(2026-08-19 减少误伤定稿)
      - "Cooking Wines"
    pt_contains:
      - "Alcohol"
      - "Alcoholic"      # 补漏:Coolers & Flavored Alcoholic Beverages
      - "Beer"
      - "Liquor"
      - "Distill"
      - "Moonshine"
      - "Tobacco"
