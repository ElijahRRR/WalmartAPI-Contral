# Walmart Category → Nice Class 映射 (供 R5 USPTO 商标类目过滤用)
#
# 策略: 按 walmart_category (映射表顶级分类, 稳定) 映射到 1-6 个 Nice Class,
#   R5 查 USPTO brand_nice_class 表时只查这些 class 下的 LIVE 商标,
#   大幅降低 "GARDEN/CAR/BROWN" 等通用词商标的命中 (它们多分布在 class 35 广告 / 41 娱乐 等服务类)
#
# Nice Class 1-45 (WIPO 官方):
#   商品: 1 化学  2 颜料  3 化妆清洁  4 油脂  5 医药  6 金属  7 机械  8 手工具  9 电子仪器
#         10 医疗器械  11 照明/蒸煮/冷藏  12 车辆  13 武器烟火  14 首饰钟表  15 乐器
#         16 纸品印刷/文具  17 橡胶半成品  18 皮革箱包  19 非金属建材  20 家具
#         21 餐具厨具  22 绳索帆船  23 纱线  24 纺织  25 服装  26 花边纽扣
#         27 地毯  28 玩具运动  29 肉食  30 米面  31 未加工农产品/宠物食品  32 饮料
#         33 酒  34 烟草
#   服务: 35-45 (R5 通常不用, 商品才相关)

version: 1
updated: 2026-04-20

category_to_nice_class:
  # Home & 家居
  Home: ['006', '011', '020', '021']             # 金属+照明+家具+餐厨
  "Home Improvement": ['006', '007', '008', '009', '011', '017', '019']
  Household: ['006', '020', '021']

  # Electronics
  Electronics: ['009']
  "Business & Industrial": ['007', '009']

  # Toys / Sporting
  Toys: ['028']
  "Games & Toys": ['028']
  "Sporting Goods": ['028']

  # Apparel / Shoes / Accessories
  Clothing: ['025']
  Apparel: ['025']
  Shoes: ['025']

  # Beauty / Health / Medical
  Beauty: ['003']
  Health: ['003', '005', '010']
  Medical: ['005', '010']

  # Baby
  Baby: ['005', '010', '012', '020', '025', '028']

  # Food / Pet
  Food: ['029', '030', '031', '032', '033']
  Grocery: ['029', '030', '031', '032']
  "Pet Food": ['031']
  "Pet Supplies": ['018', '028', '031']

  # Automotive
  Automotive: ['012']
  "Auto & Tires": ['012']
  Vehicles: ['012']

  # Garden / Patio
  "Garden & Patio": ['006', '008', '011', '021', '022', '031']
  Garden: ['006', '008', '021', '022', '031']

  # Arts & Crafts / Office
  "Arts & Crafts": ['008', '016']
  Office: ['009', '016', '020']

  # 乐器
  "Musical Instruments": ['015']

  # 纺织/寝具
  Bedding: ['024']
  "Bedding & Bath": ['024', '027']

  # Occasion / Party / Seasonal
  "Occasion & Seasonal": ['016', '028']

# walmart_category 为空或不在上表时的 fallback class list (宽松, 只挡最通用的)
# 不写太窄, 避免漏掉真品牌
default_classes: ['006', '008', '009', '011', '020', '021']
